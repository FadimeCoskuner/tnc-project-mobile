name: mini_katalog
description: "Flutter ile geliştirilmiş mini ürün kataloğu uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Yönerge gereği ekstra paket kullanılmıyor; yalnızca Flutter SDK.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
